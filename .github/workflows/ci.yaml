name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
jobs:
  CI:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check License Headers
        uses: apache/skywalking-eyes@6e387ca914675222f0df405660f88bc803c297bf
      
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@95c6bf8a2e0cd6baac9d71f9a0f2ec54e6e34136  # v2.0.1
      
      - name: Build All Targets
        run: bazel build //...
      
      - name: Run Tests
        run: bazel test //... --test_output=errors
